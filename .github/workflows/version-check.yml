name: Sibling version check

# Job A of the freeze-drift defence. Cheap, scheduled, and deliberately unable
# to fail.
#
# The book renders from a committed `_freeze/` cache, so its figures are output
# from whatever versions of the family packages were installed when someone last
# forced a re-render. When a sibling releases, nothing in this repo changes --
# no gate fires, and the published figures quietly become output from a version
# that no longer exists.
#
# This job detects that the versions have MOVED. It cannot detect breakage; only
# the deep re-render (deep-render.yml, manual) does that. It needs no R and no
# render: it reads seven sibling DESCRIPTION files over HTTPS, plus CRAN's for the
# non-family packages recorded under "cran", and compares strings.
#
# It also compares the commit each sibling was installed from ("sha" in the
# record) against the head of its main, because a version string misses work
# that lands under an unchanged number: ggRandomForests moved 67 commits under
# "4.0.0" before 2026-10-12 and this check reported nothing. A SHA recorded as
# "unknown" (a local install, which leaves none) is shown and never flagged.
#
# It reports by opening or updating a tracking issue, and always exits 0. A red
# scheduled workflow on main would say "the book is broken", which is not what
# was learned -- what was learned is "a re-render is due". Failing here would
# train people to scroll past it, which is how the stale-freeze advisory it
# replaces stopped working.

on:
  schedule:
    # Weekly, Mondays 13:00 UTC (09:00 ET). The siblings do not release daily,
    # and an issue keeps until someone reads it, so a tighter cadence buys
    # nothing.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare the recorded versions against each sibling's main
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f sibling-versions.json ]; then
            echo "::warning::sibling-versions.json is missing - there is no record of what _freeze/ was built against. Force a full local re-render (see AGENTS.md) and commit it."
            echo "status=norecord" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # package -> owner/repo. This list is the one place the set of checked
          # siblings is written down. ggsankey is checked against upstream, not
          # the ehrlinger fork: hvtiPlotR's `Remotes: davidsjoberg/ggsankey`
          # decides what every install actually gets, so upstream is what the
          # book renders against. The sibling-versions chunk in packages.qmd
          # holds the same owner, and the two must agree.
          repos="hvtiR:ehrlinger/hvtiR
          hvtiPlotR:ehrlinger/hvtiPlotR
          hvtiRutilities:ehrlinger/hvtiRutilities
          hvtiRtables:ehrlinger/hvtiRtables
          TemporalHazard:ehrlinger/TemporalHazard
          ggRandomForests:ehrlinger/ggRandomForests
          ggsankey:davidsjoberg/ggsankey"

          : > rows.md
          : > sharows.md
          drift=0
          shadrift=0
          # A full SHA prints as its 7-character prefix; "unknown" and
          # "unreachable" print as they are.
          short() { if [ "${#1}" -eq 40 ]; then echo "${1:0:7}"; else echo "$1"; fi; }
          # Paths a commit can touch without changing what the book renders
          # (docs, dev/, tests, CI). packages.qmd writes the pattern into the
          # record so there is one copy of it. An older record has none, and
          # then every commit counts.
          ignore=$(jq -r '.ignore_paths // ""' sibling-versions.json)

          while IFS= read -r line; do
            pkg="${line%%:*}"; pkg="$(echo "$pkg" | tr -d '[:space:]')"
            repo="${line##*:}"; repo="$(echo "$repo" | tr -d '[:space:]')"
            [ -z "$pkg" ] && continue

            built=$(jq -r --arg p "$pkg" '.packages[$p] // "not recorded"' sibling-versions.json)
            latest=$(curl -fsSL "https://raw.githubusercontent.com/$repo/main/DESCRIPTION" 2>/dev/null \
                     | awk '/^Version:/ {print $2; exit}') || latest=""
            [ -z "$latest" ] && latest="unreachable"

            if [ "$built" = "$latest" ]; then
              printf '| `%s` | %s | %s |\n' "$pkg" "$built" "$latest" >> rows.md
            else
              printf '| `%s` | %s | **%s** |\n' "$pkg" "$built" "$latest" >> rows.md
              [ "$latest" != "unreachable" ] && drift=1
            fi

            built_sha=$(jq -r --arg p "$pkg" '(.sha // {})[$p] // "unknown"' sibling-versions.json)
            head_sha=$(gh api "repos/$repo/commits/main" --jq .sha 2>/dev/null) || head_sha=""
            [ -z "$head_sha" ] && head_sha="unreachable"

            if [ "$built_sha" = "unknown" ] || [ "$head_sha" = "unreachable" ] \
               || [ "$built_sha" = "$head_sha" ]; then
              printf '| `%s` | %s | %s |\n' "$pkg" "$(short "$built_sha")" "$(short "$head_sha")" >> sharows.md
              continue
            fi

            # main has moved. It counts only if main is strictly ahead of the
            # recorded commit and some changed file falls outside the ignored
            # paths. A failed lookup, a record ahead of or diverged from main,
            # or a list at the API's 300-file cap all count.
            cmp=$(gh api "repos/$repo/compare/$built_sha...main" 2>/dev/null) || cmp="{}"
            status=$(jq -r '.status // "unknown"' <<< "$cmp")
            nfiles=$(jq '(.files // []) | length' <<< "$cmp")
            if [ -n "$ignore" ]; then
              ncode=$(jq --arg re "$ignore" '[(.files // [])[].filename | select(test($re) | not)] | length' <<< "$cmp")
            else
              ncode=$nfiles
            fi

            if [ "$status" = "ahead" ] && [ "$nfiles" -gt 0 ] && [ "$nfiles" -lt 300 ] \
               && [ "$ncode" -eq 0 ]; then
              printf '| `%s` | %s | %s (docs, dev or tests only) |\n' "$pkg" "$(short "$built_sha")" "$(short "$head_sha")" >> sharows.md
            else
              printf '| `%s` | %s | **%s** |\n' "$pkg" "$(short "$built_sha")" "$(short "$head_sha")" >> sharows.md
              shadrift=1
            fi
          done <<< "$repos"

          # Non-family CRAN packages whose releases have changed the book's output
          # (randomForestSRC moved three chapters' printed output on 2026-09-25).
          # packages.qmd records them under "cran" and is the one place that set is
          # written down, so read it from the record rather than repeating it here.
          # Compared against CRAN's own DESCRIPTION rather than a GitHub main.
          for pkg in $(jq -r '(.cran // {}) | keys[]' sibling-versions.json); do
            built=$(jq -r --arg p "$pkg" '.cran[$p]' sibling-versions.json)
            latest=$(curl -fsSL "https://cran.r-project.org/web/packages/$pkg/DESCRIPTION" 2>/dev/null \
                     | awk '/^Version:/ {print $2; exit}') || latest=""
            [ -z "$latest" ] && latest="unreachable"

            if [ "$built" = "$latest" ]; then
              printf '| `%s` (CRAN) | %s | %s |\n' "$pkg" "$built" "$latest" >> rows.md
            else
              printf '| `%s` (CRAN) | %s | **%s** |\n' "$pkg" "$built" "$latest" >> rows.md
              [ "$latest" != "unreachable" ] && drift=1
            fi
          done

          {
            printf '| package | the book was built against | latest (`main`, or CRAN) |\n'
            printf '|---|---|---|\n'
            sort rows.md
          } > table.md

          {
            printf '| package | built at commit | `main` is at |\n'
            printf '|---|---|---|\n'
            sort sharows.md
          } > shatable.md

          rendered=$(jq -r '.rendered // "an unrecorded date"' sibling-versions.json)
          {
            printf 'The committed `_freeze/` cache was built on **%s**. Since then, at least one tracked package has moved.\n\n' "$rendered"
            printf '### Versions\n\n'
            if [ "$drift" -eq 1 ]; then
              printf 'At least one version number has changed.\n\n'
            else
              printf 'No version number has changed.\n\n'
            fi
            cat table.md
            printf '\n### Commits\n\n'
            if [ "$shadrift" -eq 1 ]; then
              printf 'At least one sibling has new commits on `main` since the build, whether or not its version number moved.\n\n'
            else
              printf 'No sibling has new commits on `main` since the build.\n\n'
            fi
            cat shatable.md
            printf '\nA commit recorded as `unknown` was installed locally, which leaves no SHA to compare, so only its version is checked. A move that touches only documentation, `dev/`, tests or CI configuration is listed but not flagged, since it cannot change what the book renders.\n'
            printf '\n**What this does and does not mean.** The packages have moved; that is all this check can see. It does not mean a figure is wrong. It means the published figures are output from package code that is no longer current, and nothing else in CI will notice.\n'
            printf '\nA divergence can also mean the last re-render ran against unreleased local code — a sibling checkout sitting on a feature branch — rather than against `main`. Worth ruling out before re-rendering.\n'
            printf '\n**To resolve:** run the `Deep re-render` workflow from the Actions tab. It installs the siblings from GitHub and renders with the freeze bypassed, which is the only thing that catches actual breakage. If it renders clean and the figures still look right, force a local re-render and commit the refreshed `_freeze/` and `sibling-versions.json`.\n'
            printf '\n<sub>Updated automatically by `version-check.yml`. This issue is reused rather than reopened, and closes itself when the recorded versions and commits match `main` again.</sub>\n'
          } > body.md

          echo "status=$([ "$drift" -eq 1 ] || [ "$shadrift" -eq 1 ] && echo drift || echo clean)" >> "$GITHUB_OUTPUT"
          cat table.md shatable.md

      - name: Open or update the tracking issue
        if: steps.compare.outputs.status == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create freeze-drift \
            --description "The book's _freeze/ cache is older than a family package release" \
            --color D93F0B 2>/dev/null || true

          existing=$(gh issue list --label freeze-drift --state open \
                     --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Updated issue #$existing."
          else
            gh issue create \
              --title "Book _freeze/ is older than a family package release" \
              --label freeze-drift --body-file body.md
          fi

      - name: Close the tracking issue once the versions match again
        if: steps.compare.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label freeze-drift --state open \
                     --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The recorded versions and commits match each sibling's \`main\` again — the freeze has been refreshed. Closing automatically."
          else
            echo "No drift and no open issue. Nothing to do."
          fi
