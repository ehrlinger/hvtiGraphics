name: Publish book to gh-pages

# Renders the Quarto book to HTML and deploys it to the gh-pages branch.
#
# No R is set up here, by choice: `quarto render` reuses the committed `_freeze/`
# cache and never invokes R. The book's non-CRAN dependencies ARE installable on
# a runner -- they live in public GitHub repos and `hvtiR::install()`
# fetches them -- but the published figures should be ones a person reviewed, not
# ones a runner recomputed. Refresh `_freeze/` by re-rendering locally.
#
# HTML only here — the PDF/LaTeX format is built locally (it needs a TeX stack).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book (HTML, from frozen results)
        run: quarto render --to html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _book
          force_orphan: true
